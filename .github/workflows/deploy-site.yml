# Build the site and deploy it. Do not run this file before the secrets exist.
# The CMS calls this workflow with repository_dispatch (event type: cms-publish) after a publish.
name: deploy-site

# A merge into master is built and deployed by Cloudflare Workers Builds (the repo is connected in Cloudflare),
# so this workflow no longer runs on push. It still runs for a CMS publish and by hand.
on:
  repository_dispatch:
    types: [cms-publish]
  workflow_dispatch:

# One deploy at a time. A new run replaces a waiting run.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Names of repository secrets. Set the values in GitHub: Settings, Secrets and variables, Actions.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CMS_URL: ${{ secrets.CMS_URL }}
      CMS_PUBLIC_URL: ${{ secrets.CMS_PUBLIC_URL }}
      # Fail the build when the CMS is down. The old site stays live.
      REQUIRE_CMS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the site
        run: npm ci

      - name: Install the cf CLI
        run: npm install -g cf@1.0.0-beta.12

      - name: Build the site (the prerender reads the CMS)
        run: npm run build

      - name: Count the prerendered pages
        run: find .output/public -name '*.html' | wc -l

      - name: Deploy the site with cf
        run: cf deploy --prebuilt
